# Secret scanning (make secret-scan, CI). Extends the default rules.
[extend]
useDefault = true

[[allowlists]]
description = "git-ignored throwaway credentials generated by the local dev setups (never committed)"
paths = ['''(^|/)\.local/''', '''^\.claude/worktrees/''']

[[allowlists]]
description = "the deliberately fake AWS key the secret-scanner and purge tests use"
regexes = ['''AKIAQ3EGRV7XKZ2MPLWT''']

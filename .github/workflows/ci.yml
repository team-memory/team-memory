name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: teammemory
          POSTGRES_PASSWORD: teammemory-ci
          POSTGRES_DB: teammemory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teammemory"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://teammemory:teammemory-ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: sqlc generated code is current
        run: make check-generate
      - name: Unit and integration tests
        run: go test -race -count=1 ./...
      - name: No process execution in the service (go-git only)
        run: go test -count=1 -run 'TestNoProcessExecution|TestFileTransportIsInProcess' ./internal/mirror/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the secret scan covers git history
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Helm lint and template
        run: make helm-lint
      - name: Alert rules (promtool check and unit tests)
        run: make check-alerts
      - name: Container image builds
        run: docker build -t team-memory:ci .
      # The gitleaks CLI rather than gitleaks-action, which needs a paid
      # license for organization repositories. Same scans as `make secret-scan`.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm "$tarball" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner


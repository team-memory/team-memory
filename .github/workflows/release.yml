name: release

# Runs only when a version tag is pushed. Nothing is published until then.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # The chart's default image tag is its appVersion (no "v"), so push
      # that tag; the "v" tag is kept for references to the git tag.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,darwin/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Package and push chart
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/team-memory --version "$v" --app-version "$v"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "team-memory-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-memory.fullname" . }}
  labels:
    {{- include "team-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "team-memory.selector" (list . "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
---
# Metrics of every component, for scraping; never exposed by the ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "team-memory.fullname" . }}-metrics
  labels:
    {{- include "team-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "team-memory.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: metrics, port: 9090, targetPort: metrics}

{{- if .Values.migrations.enabled }}
# Applies database migrations before install and upgrade, with the operator
# URL. Migrations are forward-only and backward compatible with the previous
# release (docs/operations/upgrade.md), so a failed rollout can roll back the
# pods without rolling back the schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "team-memory.fullname" . }}-migrate
  labels:
    {{- include "team-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "team-memory.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # Hooks run before the chart's ServiceAccount exists; the job needs no
      # Kubernetes API access.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "team-memory.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "team-memory.dbSecret" . }}
                  key: {{ .Values.database.keys.operator }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}

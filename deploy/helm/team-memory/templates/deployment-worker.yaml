{{- if include "team-memory.workerEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "team-memory.fullname" . }}-worker
  labels:
    {{- include "team-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "team-memory.selector" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-memory.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "team-memory.podSecurity" . | nindent 6 }}
      # Jobs in flight record their outcome on SIGTERM; unfinished ones are
      # released when their lease expires.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: {{ include "team-memory.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - {name: metrics, containerPort: 9090}
          env:
            - name: TEAM_MEMORY_WORKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "team-memory.dbSecret" . }}
                  key: {{ .Values.database.keys.worker }}
            - name: TEAM_MEMORY_WORKER_BATCH
              value: {{ .Values.worker.batch | quote }}
            {{- include "team-memory.commonEnv" (dict "root" . "component" "worker") | nindent 12 }}
            {{- include "team-memory.embeddingEnv" . | nindent 12 }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

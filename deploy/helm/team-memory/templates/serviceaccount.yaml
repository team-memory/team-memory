{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "team-memory.serviceAccountName" . }}
  labels:
    {{- include "team-memory.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No component calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}

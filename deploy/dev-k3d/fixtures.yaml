# Disposable fixtures for the k3d test cluster only: PostgreSQL 17 +
# pgvector and Keycloak 26. Throwaway credentials come from setup.sh.
# Never deploy this anywhere that matters.
apiVersion: v1
kind: Namespace
metadata: {name: tm-db}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: tm-db}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.1-pg17
          env:
            - {name: POSTGRES_USER, value: teammemory}
            - {name: POSTGRES_DB, value: teammemory}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-superuser, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, teammemory]}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: tm-db}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: v1
kind: Namespace
metadata: {name: keycloak}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: keycloak, namespace: keycloak}
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
          envFrom: [{secretRef: {name: keycloak-env}}]
          env:
            - {name: KC_HOSTNAME, value: "https://keycloak.localtest.me"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts: [{name: realm, mountPath: /opt/keycloak/data/import}]
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata: {name: keycloak, namespace: keycloak}
spec:
  selector: {app: keycloak}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: keycloak, namespace: keycloak}
spec:
  ingressClassName: traefik
  tls: [{hosts: [keycloak.localtest.me], secretName: localtest-tls}]
  rules:
    - host: keycloak.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: keycloak, port: {number: 80}}}

name: team-memory-dev-idp
# Disposable identity providers for local SSO development and tests only.
# Credentials are generated by setup.sh into .local/ (git-ignored); nothing
# here is a secret. Both services bind to loopback only. Never deploy this.
#
#   Keycloak: full-featured IdP (has dynamic client registration, which
#             Team Memory does not rely on).
#   Dex:      IdP with no dynamic client registration and no client ID
#             metadata documents, like most enterprise IdPs.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    env_file: .local/env
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/team-memory-dev.json:ro
    ports:
      - "127.0.0.1:8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 3s
      retries: 60

  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    env_file: .local/env
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"

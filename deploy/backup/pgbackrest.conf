# pgBackRest configuration for Team Memory's PostgreSQL (docs/operations/backup-restore.md).
# The drill uses a POSIX repository on a separate volume. In production use
# an off-host repository (repo1-type=s3 with a bucket in another failure
# domain) and encrypt it (repo1-cipher-type=aes-256-cbc, passphrase from a
# secret store, never committed).
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
compress-type=zst
compress-level=3
start-fast=y
process-max=2
log-level-console=info
log-level-file=detail
archive-push-queue-max=4GiB

[tm]
pg1-path=/var/lib/postgresql/data/pgdata

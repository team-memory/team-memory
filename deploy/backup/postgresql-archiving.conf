# WAL archiving for a 15-minute RPO target. archive_timeout forces a segment
# switch at least every 60 s, so at most about a minute of committed
# transactions is not yet in the repository when the server is lost.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=tm archive-push %p'
archive_timeout = 60
max_wal_senders = 3
